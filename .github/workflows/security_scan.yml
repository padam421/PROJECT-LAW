name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Dependency vulnerability audit (fail on high)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Guard against committed secrets
        run: |
          ! grep -rInE "(supersecret|sk_live|api_key\s*=\s*['\"][A-Za-z0-9]{16,})" backend/src frontend --include="*.js" --include="*.json"
          test ! -f backend/.env
          test -z "$(git ls-files .env backend/data/db.json)"
